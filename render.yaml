services:
  - type: web
    name: nutrix-api-adhi2312
    runtime: node
    repo: https://github.com/Prithivraj22/fitness-tracker-backend
    branch: main
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: nutrix-web-adhi2312
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGO_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: FITBIT_OAUTH_STATE_SECRET
        generateValue: true
      - key: GOOGLE_HEALTH_OAUTH_STATE_SECRET
        generateValue: true
      - key: PROVIDER_TOKEN_ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: nutrix-web-adhi2312
    runtime: static
    repo: https://github.com/Adhi2312/Nutrix
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: nutrix-api-adhi2312
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
